name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libasound2-dev
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: Tests
        if: runner.os != 'Linux'
        run: python -X faulthandler -m unittest discover tests -v
      - name: GUI test repeated (macOS Tk crashes were intermittent)
        if: runner.os == 'macOS'
        run: for i in 1 2 3 4 5; do python -X faulthandler -m unittest tests.test_gui || exit 1; done
      - name: Tests (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -X faulthandler -m unittest discover tests -v
      - name: Build
        run: python build.py
      - name: Zip (macOS keeps the .app bundle intact)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent SoundStudioGold.app SoundStudioGold-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SoundStudioGold-${{ runner.os }}
          path: |
            dist/SoundStudioGold-macOS.zip
            dist/SoundStudioGold/
          if-no-files-found: error
