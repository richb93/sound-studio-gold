name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libasound2-dev
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: Tests
        if: runner.os != 'Linux'
        run: python -X faulthandler -m unittest discover tests -v
      - name: GUI test repeated (macOS Tk crashes were intermittent)
        if: runner.os == 'macOS'
        run: |
          for i in 1 2 3 4 5; do
            lldb --batch -o run -k 'thread backtrace all' -k 'quit 1' -- "$(which python)" -X faulthandler -m unittest tests.test_gui > lldb.log 2>&1
            st=$?
            if grep -q "stop reason" lldb.log || ! grep -q "^OK" lldb.log; then
              cat lldb.log
              exit 1
            fi
          done
      - name: macOS crash reports
        if: failure() && runner.os == 'macOS'
        run: |
          for f in ~/Library/Logs/DiagnosticReports/*Python*; do
            echo "=== $f"
            python - "$f" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          try:
              head, body = text.split('\n', 1)
              d = json.loads(body)
              for t in d.get('threads', []):
                  if t.get('triggered'):
                      imgs = d.get('usedImages', [])
                      for fr in t['frames'][:40]:
                          img = imgs[fr['imageIndex']].get('name', '?') if fr['imageIndex'] < len(imgs) else '?'
                          print(img, fr.get('symbol', hex(fr.get('imageOffset', 0))))
              print('exception:', d.get('exception'))
          except Exception as e:
              print(text[:6000])
          PY
          done
      - name: Tests (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -X faulthandler -m unittest discover tests -v
      - name: Build
        run: python build.py
      - name: Zip (macOS keeps the .app bundle intact)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent SoundStudioGold.app SoundStudioGold-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SoundStudioGold-${{ runner.os }}
          path: |
            dist/SoundStudioGold-macOS.zip
            dist/SoundStudioGold/
          if-no-files-found: error
